{{- /* chezmoi:modify-template */ -}}
{{- /*
Starship prompt layout. Colors come from Noctalia's built-in Starship
  template, whose apply.sh injects a [palettes.noctalia] block between the
  NOCTALIA STARSHIP PALETTE markers in the live file. This modify-template
  re-emits the layout below and carries that block over, so neither chezmoi
  nor Noctalia clobbers the other. The output mirrors apply.sh's layout
  (palette line after $schema, blank line, block) to keep `chezmoi diff` clean.

Only standard color names are used so the prompt degrades to the terminal's
  ANSI colors (also Noctalia-themed) when no palette block exists yet.
*/ -}}
{{- $block := regexFind "(?s)# >>> NOCTALIA STARSHIP PALETTE >>>.*?# <<< NOCTALIA STARSHIP PALETTE <<<" .chezmoi.stdin -}}
{{- $cache := joinPath .chezmoi.homeDir ".cache/noctalia/starship-palette.toml" -}}
{{- if and (not $block) (stat $cache) -}}
{{-   $block = printf "# >>> NOCTALIA STARSHIP PALETTE >>>\n%s\n# <<< NOCTALIA STARSHIP PALETTE <<<" (include $cache | trimSuffix "\n") -}}
{{- end -}}
"$schema" = 'https://starship.rs/config-schema.json'
{{- if $block }}
palette = "noctalia"
{{- end }}

# Spacing between prompts is handled in .zshrc so the first prompt has no
# blank line above it
add_newline = false

# Line 1: context + git on the left, runtime info on the right
# Line 2: prompt character
format = """
$directory$git_branch$git_commit$git_state$git_status\
$fill\
$python$nodejs$rust$golang$status$jobs$cmd_duration$username$hostname${env_var.CHEZMOI}$time\
$line_break\
$character"""

[fill]
symbol = ' '

[character]
success_symbol = '[»](bold green)'
error_symbol = '[»](bold red)'

[username]
format = ' [$user]($style)'
style_user = 'bold yellow'
style_root = 'bold red'

[hostname]
format = '[@$hostname]($style)'
style = 'bold yellow'

[directory]
format = '[$path]($style)[$read_only]($read_only_style)'
style = 'bold blue'
read_only = " "
read_only_style = 'red'
truncation_length = 0
truncate_to_repo = false

# ── Git ──────────────────────────────────────────────────────────────────────
[git_branch]
format = ' [$symbol$branch(:$remote_branch)]($style)'
symbol = " "
style = 'bold magenta'

[git_commit]
format = ' [$hash$tag]($style)'
style = 'bright-black'
tag_disabled = false
tag_symbol = "  "

[git_state]
format = ' [$state( $progress_current/$progress_total)]($style)'
style = 'bold yellow'

# Each indicator carries its own color and count; clean trees show nothing.
[git_status]
format = '($ahead_behind$all_status)'
ahead = ' [⇡${count}](cyan)'
behind = ' [⇣${count}](cyan)'
diverged = ' [⇡${ahead_count}⇣${behind_count}](cyan)'
up_to_date = ''
conflicted = " [ ${count}](bold red)"
stashed = " [ ${count}](bright-black)"
staged = " [ ${count}](green)"
modified = " [ ${count}](yellow)"
renamed = " [ ${count}](magenta)"
deleted = " [ ${count}](red)"
untracked = " [ ${count}](blue)"
typechanged = ''

# ── Right side ───────────────────────────────────────────────────────────────
[python]
format = ' [${symbol}${pyenv_prefix}(${version})( \($virtualenv\))]($style)'
symbol = " "
style = 'yellow'

[nodejs]
format = ' [$symbol($version)]($style)'
symbol = " "
style = 'green'

[rust]
format = ' [$symbol($version)]($style)'
symbol = " "
style = 'red'

[golang]
format = ' [$symbol($version)]($style)'
symbol = " "
style = 'cyan'

[status]
disabled = false
format = ' [$symbol$status]($style)'
symbol = '✘ '
style = 'red'

# House glyph while inside a `chezmoi cd` subshell (chezmoi exports CHEZMOI=1)
[env_var.CHEZMOI]
format = " []($style)"
style = 'bold blue'

[cmd_duration]
format = " [ $duration]($style)"
style = 'yellow'
min_time = 3000

[jobs]
format = ' [$symbol$number]($style)'
symbol = '✦'
style = 'blue'

[time]
disabled = false
format = ' [$time]($style)'
style = 'bright-black'
time_format = '%T'
{{- if $block }}

{{ $block }}
{{- end }}
